##
# Hadiya 2.0 — API on a home server, at ops.sds-max.uz.
#
#   sudo cp deploy/nginx/ops.sds-max.uz.conf /etc/nginx/sites-available/hadiya
#   sudo ln -s /etc/nginx/sites-available/hadiya /etc/nginx/sites-enabled/hadiya
#   sudo nginx -t && sudo systemctl reload nginx
#
# This host serves the **API only**. The web client is deployed to Vercel and
# lives on its own origin, so nothing static is served here — no `root`, no
# `try_files`, no SPA fallback. That split is what makes the two points below
# matter more than anything else in this file.
#
#   1. **CORS belongs to the API, not to Nginx.** The browser now calls a
#      different origin, so every request is cross-origin and carries an
#      `Authorization` header, which means the browser sends a preflight
#      `OPTIONS` first. Express's `cors` middleware answers those against
#      `CORS_ORIGINS`. Do **not** add `add_header Access-Control-Allow-Origin`
#      here: two copies of that header is not "more allowed", it is invalid,
#      and every browser rejects the response. Preflights are proxied through
#      like any other request.
#
#   2. **Streaming must not be buffered.** The assistant answers over
#      server-sent events. Buffering is off for the AI routes only; everything
#      else is small JSON that benefits from it.
#
# ops.sds-max.uz resolves to Cloudflare, so the traffic is proxied rather than
# arriving here directly. Three consequences, all handled below:
#
#   * The home connection's real address is never exposed, which is the main
#     reason to put a home server behind Cloudflare at all. Only Cloudflare's
#     ranges need to reach ports 80 and 443 — see the firewall note in
#     `docs/deployment.md`.
#   * Every request appears to come from Cloudflare unless the real address is
#     recovered from `CF-Connecting-IP`. `cloudflare-real-ip.conf` does that,
#     and without it every rate limit in the API becomes one shared bucket.
#   * The certificate here is the *origin* certificate, which the browser never
#     sees — Cloudflare presents its own. A Cloudflare Origin Certificate lasts
#     fifteen years and needs no renewal, which removes the single most common
#     way a home server goes dark: a certbot renewal that quietly stopped.
##

# Recover the visitor's address from Cloudflare. Must come before any use of
# $remote_addr below.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# --- HTTP: the ACME challenge, and a redirect for everything else -----------
server {
    listen 80;
    listen [::]:80;
    server_name ops.sds-max.uz;

    # Only needed if you use Let's Encrypt instead of a Cloudflare Origin
    # Certificate. Harmless either way, and it must stay on plain HTTP or an
    # ACME renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the API ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.sds-max.uz;

    # A Cloudflare Origin Certificate. Only Cloudflare ever validates it, and it
    # is issued for fifteen years, so there is no renewal to forget.
    #   Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate
    #   Then set SSL/TLS mode to "Full (strict)".
    # For Let's Encrypt instead, point these at /etc/letsencrypt/live/… .
    ssl_certificate     /etc/ssl/cloudflare/ops.sds-max.uz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ops.sds-max.uz.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ##
    # HSTS, and nothing else.
    #
    # The API sends its own security headers (CSP, nosniff, frame options) on
    # every response; repeating them here would duplicate them. HSTS is the
    # exception because it must also cover responses Nginx produces on its own
    # — a 502 while the API restarts, a 404 for an unknown path.
    #
    # Do not enable it until HTTPS is known to work: a browser that has seen it
    # refuses plain HTTP to this host for the whole max-age.
    ##
    # Cloudflare can also send HSTS on its own (SSL/TLS → Edge Certificates).
    # Setting it in one place only avoids a duplicated header; if you turn it on
    # at the edge, remove it here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # Clears the API's own 20 MB document limit. Keep the two in step, or a
    # large upload is refused by the proxy with a bare 413 the API never sees
    # and cannot explain.
    client_max_body_size 25m;

    # --- The assistant's event stream --------------------------------------
    #
    # Declared before the general /api/ block so it wins the match. Nginx takes
    # the first matching regex location, so anything added above this one would
    # silently capture the streaming routes and re-enable buffering.
    location ~ ^/api/v1/ai/(chat|runs/[^/]+/stream) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # The three that make SSE work at all.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A turn legitimately runs for minutes: several model calls, each with
        # its own timeout, plus tool calls. The API's budgets are the real
        # limit; this only has to outlast them, or Nginx cuts off an answer
        # that was still being written.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Everything else the API serves ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        # Long enough for a document upload to be parsed, short enough that a
        # genuinely stuck request is not held open for ever.
        proxy_read_timeout    120s;
    }

    # --- Health -------------------------------------------------------------
    #
    # Reachable for an uptime check and never logged: a probe every minute is
    # otherwise most of the access log.
    location = /api/health/live {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Anything else ------------------------------------------------------
    #
    # This host has no web interface: the application is on Vercel. A bare
    # visit gets sent there rather than a bare 404, which is kinder to anyone
    # who typed the API's address by mistake.
    #
    # Change the target when the Vercel project gets a custom domain, or
    # replace the block with `return 404;` to keep this host silent about where
    # the front end lives.
    location / {
        return 302 https://ops-web-lm3a.vercel.app$request_uri;
    }
}
