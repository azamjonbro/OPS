##
# Hadiya 2.0 / OPS — the API at ops.sds-max.uz.
#
# This host serves the **API only**. The web client is on Vercel
# (https://ops-web-lm3a.vercel.app) on its own origin, so there is no `root`,
# no `try_files` and no SPA fallback here.
#
# Two things about this file are deliberate and easy to undo by accident:
#
#   1. **Plain :80, and no redirect to HTTPS.** Cloudflare fronts this zone in
#      *Flexible* mode: the browser gets HTTPS from Cloudflare, but Cloudflare
#      reaches this machine over plain HTTP on port 80. A `return 301 https://`
#      here would send the browser back to Cloudflare, which would come back to
#      :80, which would redirect again — ERR_TOO_MANY_REDIRECTS. Add the
#      redirect only *after* an origin certificate is installed and the zone is
#      switched to Full (strict). Every other site on this host is arranged the
#      same way.
#
#   2. **No CORS headers.** The browser calls a different origin, so every
#      request is cross-origin and carries `Authorization`, which means a
#      preflight `OPTIONS` first. Express's `cors` middleware answers those
#      from `CORS_ORIGINS`. Adding `add_header Access-Control-Allow-Origin`
#      here would produce two copies of the header, which is not "more
#      allowed" — it is invalid, and every browser rejects it. Preflights are
#      proxied through like anything else.
#
# The upstream port is **4400**, not the 4000 in the repository's example:
# 4000 on this machine already belongs to the qollanma API.
##

# Recover the visitor's real address from Cloudflare, so the API's rate limits
# are not one shared bucket. Must be included before $remote_addr is used.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# The scheme the *browser* used. Cloudflare terminates TLS and forwards over
# HTTP, so $scheme is always "http" here and would tell the API the session is
# insecure. Cloudflare sends the real one in X-Forwarded-Proto; fall back to
# $scheme for a request that did not come through it.
map $http_x_forwarded_proto $ops_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name ops.sds-max.uz;

    access_log /var/log/nginx/ops.access.log;
    error_log  /var/log/nginx/ops.error.log;

    server_tokens off;

    # Clears the API's own 20 MB document limit. Keep the two in step, or a
    # large upload is refused here with a bare 413 the API never sees.
    client_max_body_size 25m;

    # Only needed for Let's Encrypt. Harmless, and it must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- The assistant's event stream --------------------------------------
    #
    # Declared before the general /api/ block so it wins: nginx takes the first
    # matching regex location, and anything added above this one would silently
    # capture the streaming routes and re-enable buffering.
    location ~ ^/api/v1/ai/(chat|runs/[^/]+/stream) {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;

        # The three that make SSE work at all.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ops_forwarded_proto;

        # A turn legitimately runs for minutes. The API's own budgets are the
        # real limit; this only has to outlast them, or nginx cuts off an
        # answer that was still being written.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Health, never logged ----------------------------------------------
    location = /api/health/live {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ops_forwarded_proto;
        access_log off;
    }

    # --- Everything else the API serves ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ops_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        # Long enough for a document upload to be parsed, short enough that a
        # genuinely stuck request is not held open for ever.
        proxy_read_timeout    120s;
    }

    # --- Anything else ------------------------------------------------------
    #
    # This host has no web interface. A bare visit is sent to the app rather
    # than given a bare 404, which is kinder to anyone who typed the API's
    # address by mistake.
    location / {
        return 302 https://ops-web-lm3a.vercel.app$request_uri;
    }
}
