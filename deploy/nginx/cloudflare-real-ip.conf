##
# Where a request really came from, when Cloudflare is in front.
#
# Generated by deploy/scripts/update-cloudflare-ips.sh from
# https://www.cloudflare.com/ips-v4 and .../ips-v6. Refresh it a few times a
# year; Cloudflare adds ranges occasionally.
#
# Without this every request arrives from a Cloudflare address, and every
# address-keyed limit in the API becomes one shared bucket:
#
#   * the sign-in limiter counts wrong passwords per address *and* username, so
#     with one apparent address a single account being guessed would throttle
#     everybody's sign-ins;
#   * `express-rate-limit`'s global budget would be spent by all users together;
#   * every log line would name the same address, which makes them useless for
#     working out who did what.
#
# `real_ip_header CF-Connecting-IP` is the one Cloudflare guarantees. It is safe
# only because `set_real_ip_from` restricts trust to Cloudflare's own ranges —
# an arbitrary client cannot forge it, because a request that did not come from
# one of these addresses has its header ignored.
#
# The API must also have TRUST_PROXY=true, or Express will not read the
# forwarded address that Nginx then sets.
##

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
