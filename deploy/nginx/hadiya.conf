##
# Hadiya 2.0 — reverse proxy and static host.
#
#   sudo cp deploy/nginx/hadiya.conf /etc/nginx/sites-available/hadiya
#   sudo ln -s /etc/nginx/sites-available/hadiya /etc/nginx/sites-enabled/hadiya
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace hadiya.example.com throughout, and obtain a certificate before
# enabling the TLS server block — `nginx -t` fails on a certificate path that
# does not exist yet, so the HTTP block below is written to work on its own
# first. `docs/deployment.md` walks through the order.
#
# The two things this file exists to get right:
#
#   1. **Streaming.** The assistant answers over server-sent events. Nginx
#      buffers proxied responses by default, which for a trickle of small
#      events means the browser sees nothing until the turn is over — the
#      feature appears broken rather than slow. Buffering is therefore turned
#      off *for the streaming location only*, not globally: every other
#      response is small JSON that benefits from being buffered.
#
#   2. **Client addresses.** The API keys its rate limits on the client
#      address. Behind a proxy every request appears to come from the proxy
#      unless the real address is forwarded and the API is told to trust it
#      (`TRUST_PROXY=true`). Without both halves, one person hitting a limit
#      silences everybody.
##

# --- HTTP: redirect everything except the ACME challenge --------------------
server {
    listen 80;
    listen [::]:80;
    server_name hadiya.example.com;

    # Certbot writes its challenge here; it must stay reachable over plain HTTP
    # or renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hadiya.example.com;

    ssl_certificate     /etc/letsencrypt/live/hadiya.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hadiya.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. Comment out if the resolver is unreachable from this host.
    ssl_stapling on;
    ssl_stapling_verify on;

    ##
    # HSTS is set here rather than left to the API, because it must also cover
    # the static files and any response Nginx produces on its own (a 404, a 502
    # while the API restarts). The API sends its own copy for direct callers.
    #
    # Do not enable this until HTTPS is known to work: a browser that has seen
    # it will refuse plain HTTP for the whole max-age, including for a site you
    # have had to roll back.
    ##
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Nginx's own default is 1m; the API's document limit is 20 MB, so this has
    # to clear it or a large upload is rejected by the proxy with a bare 413
    # before the API ever sees it. Keep the two in step.
    client_max_body_size 25m;

    # Do not advertise the exact version in the Server header.
    server_tokens off;

    # --- Static frontend ----------------------------------------------------
    root /var/www/hadiya;
    index index.html;

    # Hashed assets never change under the same name, so they can be cached
    # for a year. `index.html` must not be: it is what points at the new
    # hashes, and a cached copy pins a browser to the previous deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page application: any unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- The assistant's event stream --------------------------------------
    #
    # Declared before the general /api/ block so it wins the match. These are
    # the only routes that stream, and the only ones with buffering off.
    location ~ ^/api/v1/ai/(chat|runs/[^/]+/stream) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # The three that make SSE work at all.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A turn can legitimately run for minutes: several model calls, each
        # with its own timeout, plus tool calls. The API's own budgets are the
        # real limit; this only has to be longer than they are, or Nginx cuts
        # off an answer that was still being written.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Everything else the API serves ------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        # Generous enough for a document upload being parsed, short enough that
        # a genuinely stuck request is not held open for ever.
        proxy_read_timeout    120s;
    }

    # --- Health -------------------------------------------------------------
    #
    # Reachable for an uptime check, and never logged: a probe every fifteen
    # seconds is most of an access log otherwise.
    location = /api/health/live {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }
}
